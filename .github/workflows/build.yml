name: Build Hand Controller EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python mediapipe pyautogui pyinstaller screeninfo numpy

    - name: Build EXE with PyInstaller
      # --noconsole hides the black terminal window
      # --onefile bundles everything into a single .exe
      run: |
        pyinstaller --noconsole --onefile --name "HandController" main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HandController-App
        path: dist/HandController.exe
